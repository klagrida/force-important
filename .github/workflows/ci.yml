name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # package.json declares engines.node >= 18, so 18 is tested too.
        node: ['18', '20', '22', '24']
        # The tool is developed on Windows and writes files in place, so pin
        # one Windows job to catch path- and line-ending regressions.
        include:
          - os: windows-latest
            node: '22'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
