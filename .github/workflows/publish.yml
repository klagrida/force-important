name: Publish

# Press "Run workflow" on the Actions tab to publish.
# The version is whatever package.json says — bump it first, since npm refuses
# to republish a version that already exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm attest provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      # --access public is required alongside --provenance for a package npm has
      # not seen before; without it npm errors with EUSAGE.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
